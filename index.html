<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Welcome back - GBP Store</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="container">
        <div class="card">

            <!-- Brand Header -->
            <div class="brand-header">
                <div class="logo">
                    <svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="44" height="44" rx="12" fill="#1a4d8f" />
                        <path d="M12 28L22 12L32 28H27L22 20L17 28H12Z" fill="white" />
                        <circle cx="22" cy="18" r="2" fill="white" opacity="0.6" />
                    </svg>
                    <span>GBP Store</span>
                </div>
                <div class="store-badge">🛒 Premium Retail</div>
            </div>

            <!-- Welcome Section -->
            <h1>Welcome back</h1>
            <p class="subtitle">Sign in to your GBP Store account.</p>

            <!-- Sign In Form -->
            <form id="signin-form">
                <div class="input-group">
                    <label for="email">Email or username</label>
                    <input type="text" id="email" placeholder="Enter your email or username" required />
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required />
                </div>

                <button type="submit" class="btn-primary">Sign in</button>

                <div class="links">
                    <a href="#" class="forgot-link">Forgot password?</a>
                    <span class="signup-text">New to GBP Store? <a href="#">Create account</a></span>
                </div>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>or continue with</span>
            </div>

            <!-- Social Login Options -->
            <div class="social-logins">
                <button class="social-btn google">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M19.6 10.23c0-.82-.1-1.42-.26-2.05H10v3.72h5.43c-.11.96-.72 2.36-2.04 3.22l-.02.12 2.96 2.29.2.02c1.86-1.72 2.95-4.27 2.95-7.32z" fill="#4285F4"/>
                        <path d="M10 20c2.68 0 4.93-.88 6.57-2.4l-3.13-2.43c-.84.56-1.97.95-3.44.95-2.62 0-4.85-1.73-5.64-4.12l-.12.01L3.18 14.5l-.04.12C4.8 17.58 7.24 20 10 20z" fill="#34A853"/>
                        <path d="M4.36 11.89c-.17-.5-.27-1.02-.27-1.56 0-.54.1-1.06.26-1.56l-.01-.13L3.1 6.39l-.1.05a9.96 9.96 0 0 0 0 9.12l3.36-2.67z" fill="#FBBC05"/>
                        <path d="M10 3.95c1.87 0 3.13.81 3.85 1.48l2.81-2.74C14.92.98 12.67 0 10 0 7.24 0 4.8 2.42 3.18 5.57l3.36 2.67c.79-2.39 3.02-4.12 5.64-4.12z" fill="#EA4335"/>
                    </svg>
                    Google
                </button>
                <button class="social-btn apple">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M14.06 3.05c.78-.95 1.3-2.26 1.15-3.05-.98.04-2.15.65-2.86 1.48-.63.75-1.18 1.87-1.03 2.97 1.1.09 2.22-.55 2.74-1.4zM17.15 6.78c-1.14-.88-2.74-.76-3.8.28-1.07 1.04-1.07 2.74-.04 3.8-1.04 1.07-1.04 2.74-.04 3.8 1.07 1.04 2.74 1.04 3.8-.04 1.07-1.04 1.07-2.74.04-3.8 1.04-1.07 1.04-2.74.04-3.8z" fill="#000"/>
                        <path d="M2.5 5.5h12v11h-12z" fill="#fff"/>
                    </svg>
                    Apple
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>&copy; 2026 GBP Store. All rights reserved.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
