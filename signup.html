<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create account - GBP Store</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="brand-header">
                <div class="logo">
                    <div class="flex h-11 w-11 items-center justify-center rounded-md bg-primary text-xl font-bold text-white">£</div>
                    <span>GBP Store</span>
                </div>
                <div class="store-badge">🛒 Premium Retail</div>
            </div>

            <h1>Create account</h1>
            <p class="subtitle">Join GBP Store and start shopping.</p>

            <div id="error-message" class="hidden rounded-lg bg-red-50 p-3 text-sm text-red-600 mb-4"></div>
            <div id="success-message" class="hidden rounded-lg bg-green-50 p-3 text-sm text-green-600 mb-4"></div>

            <form id="signup-form">
                <div class="input-group">
                    <label for="display-name">Display Name</label>
                    <input type="text" id="display-name" placeholder="Choose a username" required />
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required />
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password (min 6 chars)" required minlength="6" />
                </div>

                <button type="submit" class="btn-primary" id="signup-btn">Create account</button>

                <div class="links">
                    <span class="signup-text">Already have an account? <a href="login.html">Sign in</a></span>
                </div>
            </form>

            <div class="divider"><span>or continue with</span></div>

            <div class="social-logins">
                <button class="social-btn google" id="google-signup">
                    <svg width="20" height="20" viewBox="0 0 20 20"><path d="M19.6 10.23c0-.82-.1-1.42-.26-2.05H10v3.72h5.43c-.11.96-.72 2.36-2.04 3.22l-.02.12 2.96 2.29.2.02c1.86-1.72 2.95-4.27 2.95-7.32z" fill="#4285F4"/><path d="M10 20c2.68 0 4.93-.88 6.57-2.4l-3.13-2.43c-.84.56-1.97.95-3.44.95-2.62 0-4.85-1.73-5.64-4.12l-.12.01L3.18 14.5l-.04.12C4.8 17.58 7.24 20 10 20z" fill="#34A853"/><path d="M4.36 11.89c-.17-.5-.27-1.02-.27-1.56 0-.54.1-1.06.26-1.56l-.01-.13L3.1 6.39l-.1.05a9.96 9.96 0 0 0 0 9.12l3.36-2.67z" fill="#FBBC05"/><path d="M10 3.95c1.87 0 3.13.81 3.85 1.48l2.81-2.74C14.92.98 12.67 0 10 0 7.24 0 4.8 2.42 3.18 5.57l3.36 2.67c.79-2.39 3.02-4.12 5.64-4.12z" fill="#EA4335"/></svg>
                    Google
                </button>
            </div>
        </div>
        <div class="footer"><p>&copy; 2026 GBP Store. All rights reserved.</p></div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
</body>
</html>
